services:
  db:
    image: postgres:16
    container_name: opscenter-db
    environment:
      POSTGRES_DB: opscenter
      POSTGRES_USER: opscenter
      POSTGRES_PASSWORD: opscenter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opscenter"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opscenter-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://opscenter:opscenter@db:5432/opscenter
      - SECRET_KEY=opscenter-secret-key-change-in-production
      - PYTHONPATH=/workspace
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/workspace
    working_dir: /workspace/backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opscenter-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501

volumes:
  postgres_data: