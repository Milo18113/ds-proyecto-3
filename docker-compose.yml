services:
  db:
    image: postgres:16
    container_name: opscenter-db
    environment:
      POSTGRES_DB: opscenter
      POSTGRES_USER: opscenter
      POSTGRES_PASSWORD: opscenter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: opscenter-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: opscenter-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - backend

volumes:
  postgres_data: